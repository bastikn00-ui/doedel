function plan(){let pool=[],prev=new Set();Object.values(S.res).sort((a,b)=>b.seq-a.seq).slice(0,2).forEach(r=>{prev.add(r.a);prev.add(r.b)});
 const top=Math.min(T(),S.sd+(S.pre?1:0));
 for(let d=1;d<=top;d++)for(let i=0;i<8;i++)for(let j=i+1;j<8;j++)if(!S.res[key(d,i,j)]&&!abs().includes(i)&&!abs().includes(j))pool.push({d,i,j});
 const rounds=[];
 while(pool.length){const o=Array(8).fill(0);pool.forEach(m=>{o[m.i]++;o[m.j]++});const used=new Set(),rd=[];
  for(let k=0;k<2;k++){let c=pool.filter(m=>!used.has(m.i)&&!used.has(m.j)&&!prev.has(m.i)&&!prev.has(m.j));
   if(!c.length)c=pool.filter(m=>!used.has(m.i)&&!used.has(m.j));if(!c.length)break;
   c.sort((x,y)=>(o[y.i]+o[y.j])-(o[x.i]+o[x.j])||x.d-y.d);const m=c[0];rd.push(m);used.add(m.i);used.add(m.j);pool.splice(pool.indexOf(m),1)}
  rounds.push(rd);prev=used}
 return rounds}

const RULES0=`# Spielmodus
- 301 Single Out, Best of 1 Leg
- Gespielt wird auf 2 Scheiben
- An jedem Spieltag spielt jeder gegen jeden (Hinrunde)
- Niemand spielt zweimal hintereinander, wer die meisten offenen Spiele hat, kommt zuerst dran
# Wertung
- Sieg = 3 Punkte, Unentschieden = 1 Punkt, Niederlage = 0 Punkte
- Nach 20 Runden ohne Sieger endet das Spiel unentschieden, beide notieren ihre Restpunkte
- Tabelle: Punkte, dann Differenz (gegnerische Restpunkte bei Sieg oder Unentschieden minus eigene Restpunkte bei Niederlage oder Unentschieden), dann Siege
# Fehlende Spieler
- Wer einen Spieltag verpasst, holt die Spiele am nächsten Spieltag nach oder spielt sie vorher
- Zusätzliche Nachholtage sind möglich, die Gesamtzahl der Spiele bleibt gleich
# Strafen
- 26 geworfen: 0,50 €
- 3 Punkte oder weniger geworfen: 1 €
- Eine 0 geworfen: 2 €
- Wand getroffen: 1 €
- 180 geworfen: alle anderen Spieler zahlen je 5 €, der Werfer nicht
# Kasse
- Beitrag 10 € pro Spieltag, egal ob anwesend
- Dazu kommen die Strafen des jeweiligen Spieltags
- Ausgaben (Essen, Veranstaltungen) werden in der Kasse gebucht
# Treffpunkt

 if(x.done){if(x.eid){(S.dl=S.dl||{})["e:"+x.eid]=Date.now();S.exp=(S.exp||[]).filter(e=>e.id!=x.eid)}ubuy(id,()=>({done:false,bk:false,eid:null}));L("Anschaffung wieder offen: "+x.txt);save();render();return}
 const mo=document.getElementById("mo");mo.style.display="flex";mo.innerHTML=`<div class="card"><b>🛒 ${esc(x.txt)}</b><div class="tag" style="margin:6px 0 10px">Wurde das bezahlt? Dann wird der Betrag als Ausgabe in der Kasse gebucht.</div><div class="tag">Bezahlter Betrag (€)</div><input id="by_pay" type="number" step="0.5" inputmode="decimal" value="${x.pr||""}"><div class="row" style="margin-top:14px"><button onclick="closeM()">Abbrechen</button><button onclick="buyDone(${id},false)">Ohne Buchung</button><button class="p" onclick="buyDone(${id},true)">Kaufen und buchen</button></div></div>`}
function buyDone(id,book){const x=(S.buy||[]).find(y=>y.id==id);if(!x)return;const a=parseFloat(String(document.getElementById("by_pay").value).replace(",","."));if(book&&!(a>0))return toast("Bitte den bezahlten Betrag eingeben");
 let eid=null;if(book){eid=Date.now();S.exp=[{id:eid,ts:eid,by:ME,cat:"🎯 Material",txt:x.txt,amt:Math.round(a*100)/100}].concat(S.exp||[])}
 ubuy(id,()=>({done:true,bk:!!book,eid,pr:a>0?Math.round(a*100)/100:x.pr}));L("Gekauft: "+x.txt+(book?" ("+eur(a)+")":""));save();closeM();render();if(book)toast("In der Kasse als Ausgabe gebucht")}
function delBuy(id){(S.dl=S.dl||{})["b:"+id]=Date.now();S.buy=(S.buy||[]).filter(x=>x.id!=id);L("Anschaffung gelöscht");save();render()}
function buyToKasse(id){const x=(S.buy||[]).find(y=>y.id==id);if(!x||!x.pr)return;const e=Date.now();S.exp=[{id:e,ts:e,by:ME,cat:"🎯 Material",txt:x.txt,amt:x.pr}].concat(S.exp||[]);ubuy(id,()=>({bk:true,eid:e}));L("Ausgabe aus Anschaffung: "+x.txt);save();render();toast("In die Kasse gebucht")}
